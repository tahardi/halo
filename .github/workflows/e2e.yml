name: E2E

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-e2e:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: './app/.nvmrc'
          cache: 'npm'
          cache-dependency-path: './app/package-lock.json'

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm ci

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --no-install

      - name: Cache Pods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: app/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}

      - name: Install Pods
        run: cd ios && pod install

      - name: Start Simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][]|select(.name|startswith("iPhone"))][0].udid')
          xcrun simctl boot "$UDID"

      - name: Build for Simulator
        run: >
          xcodebuild -workspace ios/Halo.xcworkspace -scheme Halo -configuration Release
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build
          ARCHS=arm64 ONLY_ACTIVE_ARCH=YES | tail -50

      - name: Install App
        run: |
          xcrun simctl bootstatus booted -b
          xcrun simctl install booted build/Build/Products/Release-iphonesimulator/Halo.app

      - name: Install Maestro
        run: |
          export MAESTRO_VERSION=2.10.0
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Flows
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 600000
        run: >
          maestro test e2e/
          --debug-output maestro-debug
          --test-output-dir maestro-output

      - name: Upload Maestro Debug Output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: maestro-debug
          include-hidden-files: true
          path: |
            app/maestro-debug
            app/maestro-output
            ~/.maestro/tests
